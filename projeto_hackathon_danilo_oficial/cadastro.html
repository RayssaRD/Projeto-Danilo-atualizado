<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Mural</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white p-5">
    <div class="container" style="max-width: 400px;">
        <h2 class="text-warning">Criar Conta</h2>
        <form id="formCadastro">
            <input type="text" id="autor" class="form-control mb-2" placeholder="Seu Nome" required>
            <input type="email" id="email" class="form-control mb-2" placeholder="Seu E-mail" required>
            <input type="password" id="senha" class="form-control mb-2" placeholder="Sua Senha" required>
            <button type="submit" class="btn btn-warning w-100">Cadastrar</button>
        </form>
        <p class="mt-3">Já tem conta? <a href="login.html">Faça Login</a></p>
    </div>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            const dados = new FormData();
            dados.append('autor', document.getElementById('autor').value);
            dados.append('email', document.getElementById('email').value);
            dados.append('senha', document.getElementById('senha').value);

            fetch('PHP/cadastro.php', { method: 'POST', body: dados })
            .then(res => res.text()) // O seu cadastro.php atual retorna texto, não JSON
            .then(msg => {
                alert(msg);
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
