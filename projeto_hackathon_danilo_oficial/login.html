<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Mural Seguro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white d-flex align-items-center vh-100">

    <div class="container" style="max-width: 400px;">
        <div class="card bg-secondary p-4 shadow">
            <h2 class="text-center text-warning">Entrar</h2>
            
            <form id="formLogin">
                <div class="mb-3">
                    <label>E-mail:</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Senha:</label>
                    <input type="password" id="senha" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Acessar Mural</button>
            </form>
            
            <p class="mt-3 text-center">
                Não tem conta? <a href="cadastro.html" class="text-info">Cadastre-se</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            const dados = new FormData();
            dados.append('email', document.getElementById('email').value);
            dados.append('senha', document.getElementById('senha').value);

            // ATENÇÃO: Verifique se o caminho para o seu login.php está correto aqui
            fetch('PHP/login.php', { 
                method: 'POST',
                body: dados,
            })
            .then(res => res.json())
            .then(retorno => {
                if (retorno.status === 'sucesso') {
                    alert(retorno.mensagem);
                    // Se deu certo, o PHP criou a sessão, agora vamos para o Mural
                    window.location.href = 'index.html'; 
                } else {
                    alert(retorno.mensagem);
                }
            })
            .catch(erro => console.error("Erro no login:", erro));
        });
    </script>
</body>
</html>
