<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Ao Vivo - Hackathon</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-5">

    <div class="container text-center">
        <h1 class="mb-4 text-warning fw-bold">Mural Ao Vivo</h1>
        
        <form id="formMensagem" class="d-flex justify-content-center mb-5 gap-2">
            <input type="text" name="autor" id="autor" class="form-control w-50 bg-dark text-white border-secondary" placeholder="Escreva seu nome..." required autocomplete="off">
            <input type="text" name="texto" id="texto" class="form-control w-50 bg-dark text-white border-secondary" placeholder="Envie sua mensagem para rede..." required autocomplete="off">
            <button type="submit" class="btn btn-warning fw-bold">Enviar</button>
        </form>

        <div id="mural" class="row justify-content-center gap-3 flex-column aling-item-center"></div>
    </div>
<script src="../SCRIPT/script.js"></script>
</body>
</html>
