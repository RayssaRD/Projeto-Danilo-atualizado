<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Ao Vivo - Hackathon</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilo rápido para o Chat Privado */
        #lista-usuarios { cursor: pointer; }
        .usuario-item:hover { background: #444; }
        #janela-chat { 
            display: none; 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            width: 300px; 
            z-index: 1000; 
        }
    </style>
</head>
<body class="p-5">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-secondary rounded p-3">
                <h4 class="text-warning">Contatos</h4>
                <div id="lista-usuarios" class="list-group list-group-flush">
                    </div>
                <hr>
                <a href="PHP/logout.php" class="btn btn-danger w-100">Sair do Sistema</a>
            </div>

            <div class="col-md-9 text-center">
                <h1 class="mb-4 text-warning fw-bold">Mural Ao Vivo</h1>

                <form id="formMensagem" class="d-flex justify-content-center mb-5 gap-2">
                    <input type="text" id="texto" class="form-control w-50 bg-dark text-white border-secondary" placeholder="Envie sua mensagem para rede..." required autocomplete="off">
                    <button type="submit" class="btn btn-warning fw-bold">Enviar</button>
                </form>

                <div id="mural" class="d-flex flex-column align-items-center gap-3"></div>
            </div>
        </div>
    </div>

    <div id="janela-chat" class="card bg-dark border-warning text-white">
        <div class="card-header bg-warning text-dark d-flex justify-content-between">
            <strong id="chat-com-nome">Chat</strong>
            <button class="btn-close" onclick="fecharChat()"></button>
        </div>
        <div id="corpo-chat" class="card-body overflow-auto" style="height: 250px;">
            </div>
        <div class="card-footer">
            <form id="formChatPrivado" class="d-flex gap-1">
                <input type="hidden" id="destinatario_id">
                <input type="text" id="msg-privada" class="form-control form-control-sm" placeholder="Privado..." required>
                <button type="submit" class="btn btn-warning btn-sm"> > </button>
            </form>
        </div>
    </div>

    <script src="../SCRIPT/script.js"></script>
</body>
</html>
